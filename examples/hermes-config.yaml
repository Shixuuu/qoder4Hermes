# Merge into ~/.hermes/config.yaml
# Local CN *model* transport (not qoderclicn agent). Keep PAT on the server, not here.

model:
  default: qwen3.8-max
  provider: custom:qoder-cn-local

providers:
  qoder-cn-local:
    name: Qoder CN (inference facade)
    base_url: http://127.0.0.1:8787/v1
    api_key: not-used
    transport: chat_completions
    models:
      qwen3.8-max: {}
      Qwen3.8-Max: {}
